# Simulated candidates for the conversation eval (roadmap phase 12).
#
# Each persona has:
#   facts:    what the simulated candidate knows about themselves (free text, shown to the
#             simulator model only). Write it the way the person would think it.
#   style:    how they write (shown to the simulator).
#   script:   optional behaviour beats ("after X, do Y"), shown to the simulator.
#   truth:    machine-checkable ground truth, compared with the final candidate record.
#             Only the fields listed in `expect.fields` are scored.
#   forced:   optional fixed messages at a candidate turn (1-based), sent instead of the
#             simulator's. Use them for the beats the eval must not leave to chance.
#   expect:   the outcome the engine should reach: status, optional reason, scored fields.
#
# "Today" is fixed at 2026-10-13 (a Tuesday) by the runner, so relative dates are stable:
# "mañana" = 2026-10-14, "el lunes que viene" = 2026-10-19.
#
# Truth formats:
#   age: int (a birth year in the chat is accepted if it yields this age)
#   location: {city, zone} config ids, or {out_of_area: true}
#   availability / schedule: lists (order ignored)
#   experience: {years, platforms} (platform ids from screening.yaml)
#   start_date: [earliest, latest] ISO dates, inclusive

personas:
  - id: lucia-terse-es
    title: Terse, Spain
    language: es
    country_hint: ES
    facts: |
      Lucía Fernández Ruiz, 24 años. Moto propia (scooter 125). Carné A2 desde hace 3 años.
      Vives en Chamberí, Madrid. Quieres jornada completa, mejor por las tardes.
      2 años de experiencia como repartidora en Glovo. Puedes empezar el lunes que viene.
    style: Very terse. One to four words per message, lowercase, no punctuation. Answers only what is asked.
    truth:
      full_name: Lucía Fernández Ruiz
      age: 24
      vehicle_type: motorbike
      has_license: true
      location: {city: madrid, zone: mad-chamberi}
      availability: [full_time]
      schedule: [afternoon]
      experience: {years: 2, platforms: [glovo]}
      start_date: ["2026-10-19", "2026-10-19"]
    expect:
      status: interview_scheduled
      fields: [full_name, age, vehicle_type, has_license, location, availability, schedule, experience, start_date]

  - id: jose-chatty-mx
    title: Chatty, Mexican slang, several answers at once
    language: es
    country_hint: MX
    facts: |
      José Ramírez Ortega, naciste en 1998 (tienes 28). Tienes moto, una Italika 150, y licencia
      de manejo vigente. Vives en Coyoacán, CDMX. Quieres medio tiempo y trabajar SOLO por las
      mañanas (estudias por las tardes). Trabajaste 1 año en Rappi, ninguna otra app. Puedes
      empezar mañana mismo.
    style: |
      Chatty Mexican Spanish with slang (órale, chido, va, neta, carnal). You often answer two or
      three things in one message, e.g. name and age and vehicle together, and add a short
      personal comment. Two sentences at most.
    truth:
      full_name: José Ramírez Ortega
      age: 28
      vehicle_type: motorbike
      has_license: true
      location: {city: cdmx, zone: cdmx-coyoacan}
      availability: [part_time]
      schedule: [morning]
      experience: {years: 1, platforms: [rappi]}
      start_date: ["2026-10-14", "2026-10-14"]
    expect:
      status: interview_scheduled
      fields: [full_name, age, vehicle_type, has_license, location, availability, schedule, experience, start_date]

  - id: tom-english
    title: English speaker
    language: en
    facts: |
      Tom Baker, 31. You drive a car and have a full EU driving licence. You live in Gràcia,
      Barcelona. Part time, evenings. No delivery experience at all, this would be your first
      delivery job. You can start in two weeks, on Tuesday 27 October.
    style: Polite, plain English, short sentences. You do not speak Spanish.
    truth:
      full_name: Tom Baker
      age: 31
      vehicle_type: car
      has_license: true
      location: {city: barcelona, zone: bcn-gracia}
      availability: [part_time]
      schedule: [evening]
      experience: {years: 0, platforms: []}
      start_date: ["2026-10-26", "2026-10-28"]
    expect:
      status: interview_scheduled
      fields: [full_name, age, vehicle_type, has_license, location, availability, schedule, experience, start_date]

  - id: daniel-code-switch
    title: Code-switching ES to EN mid-conversation
    language: es
    facts: |
      Daniel Okafor, 27. Motorbike with a valid licence. You live in Ruzafa, Valencia.
      Full time, any shift (flexible). 3 years with Deliveroo in Dublin. You can start tomorrow.
    style: |
      Your Spanish is basic. You answer the first two or three questions in simple Spanish, then
      you ask to continue in English and write only English from then on.
    forced:
      - {turn: 3, text: "Tengo 27. Sorry, can we continue in English? My Spanish is not great"}
    truth:
      full_name: Daniel Okafor
      age: 27
      vehicle_type: motorbike
      has_license: true
      location: {city: valencia, zone: val-ruzafa}
      availability: [full_time]
      schedule: [flexible]
      experience: {years: 3, platforms: [deliveroo]}
      start_date: ["2026-10-14", "2026-10-14"]
    expect:
      status: interview_scheduled
      fields: [full_name, age, vehicle_type, has_license, location, availability, schedule, experience, start_date]

  - id: carla-typos-correction
    title: Typos, then corrects an answer at the recap
    language: es
    country_hint: ES
    facts: |
      Carla Méndez Soto, 34 años. Coche y carné B. Vives en Triana, Sevilla (pero por error
      primero dices Nervión). Media jornada, por las noches. 1 año en Uber Eats, ninguna otra
      app. Puedes empezar el lunes que viene.
    style: Lots of typos and no accents ("tngo", "nervion", "q", "xq"), casual Spain Spanish.
    script: |
      When asked where you live, say Nervión, Sevilla. When Sofi shows the summary to confirm,
      correct it: you actually live in Triana, not Nervión. Then confirm.
    truth:
      full_name: Carla Méndez Soto
      age: 34
      vehicle_type: car
      has_license: true
      location: {city: sevilla, zone: sev-triana}
      availability: [part_time]
      schedule: [evening]
      experience: {years: 1, platforms: [uber_eats]}
      start_date: ["2026-10-19", "2026-10-19"]
    expect:
