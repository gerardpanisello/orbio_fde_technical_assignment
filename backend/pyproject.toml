[project]
name = "sazon-screening"
version = "0.1.0"
description = "AI screening agent for Grupo Sazón delivery drivers"
readme = "README.md"
authors = [
    { name = "Gerard", email = "gilpanisellogerard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "C4", "RET"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "evals"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ac(id): acceptance criterion covered by this test",
    "live: needs ANTHROPIC_API_KEY and LLM_MODE=anthropic",
]
