    questions:
      es:
        - "¿Qué pasa después?"
        - "¿Cuáles son los siguientes pasos?"
        - "¿Cuándo empezaría?"
      en:
        - "What happens next?"
        - "What are the next steps?"
        - "When would I start?"
      ca:
