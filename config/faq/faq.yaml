      es-MX: "En México se paga entre 70 y 95 MXN la hora, según la ciudad y el turno, más un extra por entrega en horas pico. El monto exacto te lo confirma el equipo en la entrevista."
      en: "In Mexico the pay is between 70 and 95 MXN per hour, depending on the city and the shift, plus an extra per delivery at peak times. The team confirms the exact amount at the interview."
      ca-ES: "A Mèxic es paga entre 70 i 95 MXN l'hora, segons la ciutat i el torn, més un extra per entrega en hores punta. L'import exacte te'l confirma l'equip a l'entrevista."

