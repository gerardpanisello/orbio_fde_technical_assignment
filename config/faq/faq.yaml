  # --- vehicle and equipment -----------------------------------------------------------
  - id: vehicle-own
    country: all
    updated: 2026-10-01
    tags: [vehiculo, moto, bici, bicicleta, coche, carro, propio, propia, vehicle, bike, motorbike, scooter, car, own]
    questions:
      es:
        - "¿Necesito moto propia?"
        - "¿Tengo que tener vehículo propio?"
        - "¿Vosotros ponéis la moto?"
        - "¿Puedo repartir en bici?"
      en:
        - "Do I need my own bike?"
        - "Do I need my own vehicle?"
        - "Do you provide the motorbike?"
        - "Can I deliver by bicycle?"
      ca:
        - "Necessito moto pròpia?"
        - "He de tenir vehicle propi?"
        - "Vosaltres poseu la moto?"
        - "Puc repartir amb bici?"
    answer:
      es-ES: "Puedes repartir con tu propio vehículo (moto, bici, bici eléctrica o coche) y en algunos locales hay motos de empresa para turnos completos. Si usas el tuyo, se compensa el desgaste por kilómetro."
      es-MX: "Puedes repartir con tu propio vehículo (moto, bici, bici eléctrica o carro) y en algunas sucursales hay motos de la empresa para turnos completos. Si usas el tuyo, se compensa el desgaste por kilómetro."
      en: "You can deliver with your own vehicle (motorbike, bicycle, e-bike or car), and some restaurants have company motorbikes for full shifts. If you use your own, wear and tear is compensated per kilometre."
      ca-ES: "Pots repartir amb el teu propi vehicle (moto, bici, bici elèctrica o cotxe) i en alguns locals hi ha motos d'empresa per a torns complets. Si fas servir el teu, es compensa el desgast per quilòmetre."

  - id: fuel-maintenance
    country: all
    updated: 2026-10-01
    tags: [gasolina, combustible, mantenimiento, taller, averia, fuel, petrol, gas, maintenance, repair]
    questions:
      es:
        - "¿Quién paga la gasolina?"
        - "¿Me pagáis el combustible?"
        - "¿Y el mantenimiento de la moto?"
        - "Si se me estropea la moto, ¿qué pasa?"
      en:
        - "Who pays for fuel?"
        - "Do you cover petrol?"
        - "Who pays for maintenance?"
      ca:
        - "Qui paga la gasolina?"
        - "Em pagueu el combustible?"
        - "I el manteniment de la moto?"
        - "Si se m'espatlla la moto, què passa?"
    answer:
      es-ES: "Con moto de empresa, la gasolina y el mantenimiento los cubre Grupo Sazón. Con vehículo propio se paga una compensación por kilómetro que cubre combustible y desgaste."
      es-MX: "Con moto de la empresa, la gasolina y el mantenimiento los cubre Grupo Sazón. Con vehículo propio se paga una compensación por kilómetro que cubre gasolina y desgaste."
      en: "With a company motorbike, Grupo Sazón covers fuel and maintenance. With your own vehicle you get a per-kilometre allowance that covers fuel and wear."
      ca-ES: "Amb moto d'empresa, la gasolina i el manteniment els cobreix Grupo Sazón. Amb vehicle propi es paga una compensació per quilòmetre que cobreix el combustible i el desgast."

  - id: insurance
    country: all
    updated: 2026-10-01
    tags: [seguro, accidente, cobertura, insurance, accident, cover]
    questions:
      es:
        - "¿Tengo seguro?"
        - "¿Qué pasa si tengo un accidente?"
        - "¿Estoy cubierto mientras reparto?"
      en:
        - "Am I insured?"
        - "What if I have an accident?"
        - "Is there insurance while delivering?"
      ca:
        - "Tinc assegurança?"
        - "Què passa si tinc un accident?"
        - "Estic cobert mentre reparteixo?"
    answer:
      es-ES: "Sí: mientras repartes tienes un seguro de accidentes contratado por Grupo Sazón, también si usas tu propio vehículo. El equipo te da los detalles al empezar."
      en: "Yes: while delivering you are covered by an accident insurance taken out by Grupo Sazón, also if you use your own vehicle. The team gives you the details when you start."
      ca-ES: "Sí: mentre reparteixes tens una assegurança d'accidents contractada per Grupo Sazón, també si fas servir el teu propi vehicle. L'equip te'n dona els detalls quan comencis."

  - id: uniform-equipment
    country: all
    updated: 2026-10-01
    tags: [uniforme, mochila, caja, casco, equipo, chaqueta, uniform, backpack, helmet, equipment, bag]
    questions:
      es:
        - "¿Me dais uniforme?"
        - "¿La mochila la pongo yo?"
        - "¿Tengo que llevar mi propio casco?"
      en:
        - "Do you give me a uniform?"
        - "Do I need my own delivery bag?"
        - "Do I need a helmet?"
      ca:
        - "Em doneu uniforme?"
        - "La motxilla la poso jo?"
        - "He de portar el meu propi casc?"
    answer:
      es-ES: "Grupo Sazón te da el uniforme, la chaqueta impermeable y la mochila térmica sin coste. El casco lo pones tú si repartes con tu moto; con moto de empresa también va incluido."
      en: "Grupo Sazón gives you the uniform, a waterproof jacket and the thermal bag at no cost. You bring your own helmet if you ride your own motorbike; with a company one it is included."
      ca-ES: "Grupo Sazón et dona l'uniforme, la jaqueta impermeable i la motxilla tèrmica sense cost. El casc el poses tu si reparteixes amb la teva moto; amb moto d'empresa també hi va inclòs."

  # --- time --------------------------------------------------------------------------
  - id: schedule-shifts
    country: all
    updated: 2026-10-01
    tags: [horario, turno, turnos, franja, comidas, cenas, schedule, shift, shifts, hours, lunch, dinner]
    questions:
      es:
        - "¿Qué horario hay?"
        - "¿Cuáles son los turnos?"
        - "¿Se trabaja de noche?"
        - "¿Puedo elegir horario?"
      en:
        - "What are the hours?"
        - "What shifts are there?"
        - "Can I choose my schedule?"
        - "Do you work nights?"
      ca:
        - "Quin horari hi ha?"
        - "Quins són els torns?"
        - "Es treballa de nit?"
        - "Puc triar l'horari?"
    answer:
      es-ES: "Hay turnos de comidas (12:00 a 16:30) y de cenas (19:30 a 23:30), y en algunas ciudades también de mañana. Eliges tus franjas cada semana según la disponibilidad que nos des."
      en: "There are lunch shifts (12:00 to 16:30) and dinner shifts (19:30 to 23:30), and in some cities morning shifts too. You pick your slots each week based on the availability you give us."
      ca-ES: "Hi ha torns de dinars (de 12:00 a 16:30) i de sopars (de 19:30 a 23:30), i en algunes ciutats també de matí. Tries les teves franges cada setmana segons la disponibilitat que ens donis."

  - id: minimum-hours
    country: all
    updated: 2026-10-01
    tags: [minimo, horas, semana, jornada, parcial, minimum, hours, week, part]
    questions:
      es:
        - "¿Cuántas horas tengo que hacer?"
        - "¿Hay un mínimo de horas a la semana?"
        - "¿Puedo trabajar solo unas horas?"
      en:
        - "How many hours do I have to work?"
        - "Is there a minimum number of hours per week?"
        - "Can I work just a few hours?"
      ca:
        - "Quantes hores he de fer?"
        - "Hi ha un mínim d'hores a la setmana?"
        - "Puc treballar només unes hores?"
    answer:
      es-ES: "El mínimo es de 12 horas a la semana (media jornada desde 20 y jornada completa 40). Dentro de eso eliges las franjas que mejor te vengan."
      en: "The minimum is 12 hours a week (part-time from 20, full-time 40). Within that, you choose the slots that suit you best."
      ca-ES: "El mínim és de 12 hores a la setmana (mitja jornada a partir de 20 i jornada completa 40). Dins d'això tries les franges que et vagin millor."

  - id: weekends
    country: all
    updated: 2026-10-01
    tags: [fines de semana, finde, sabado, domingo, festivos, weekend, weekends, saturday, sunday, holidays]
    questions:
      es:
        - "¿Hay que trabajar los fines de semana?"
        - "¿Se trabaja sábados y domingos?"
        - "¿Puedo trabajar solo los findes?"
      en:
        - "Do I have to work weekends?"
        - "Can I work only on weekends?"
        - "Do you work on Sundays?"
      ca:
        - "S'ha de treballar els caps de setmana?"
        - "Es treballa dissabtes i diumenges?"
        - "Puc treballar només els caps de setmana?"
    answer:
      es-ES: "Los fines de semana son los días con más pedidos, así que pedimos al menos un día de fin de semana al mes. También hay contratos solo de fin de semana."
      en: "Weekends are the busiest days, so we ask for at least one weekend day a month. There are also weekend-only contracts."
      ca-ES: "Els caps de setmana són els dies amb més comandes, així que demanem almenys un dia de cap de setmana al mes. També hi ha contractes només de cap de setmana."

  - id: payment-frequency
    country: all
    updated: 2026-10-01
    tags: [nomina, cuando, cobro, quincena, mensual, semanal, payday, paid, monthly, weekly]
    questions:
      es:
        - "¿Cuándo se cobra?"
        - "¿Pagáis cada mes o cada semana?"
        - "¿Cada cuánto me pagan?"
      en:
        - "When do I get paid?"
        - "How often do you pay?"
        - "Is it weekly or monthly pay?"
      ca:
        - "Quan pagueu la nòmina?"
        - "Pagueu cada mes o cada setmana?"
        - "Cada quant em pagueu?"
    answer:
      es-ES: "En España la nómina se cobra cada mes, a final de mes, por transferencia. En México el pago es semanal, cada viernes."
      es-MX: "En México el pago es semanal, cada viernes, por transferencia. En España la nómina es mensual."
      en: "In Spain you are paid monthly, at the end of the month, by bank transfer. In Mexico pay is weekly, every Friday."
      ca-ES: "A Espanya la nòmina es cobra cada mes, a final de mes, per transferència. A Mèxic el pagament és setmanal, cada divendres."

  - id: tips
    country: all
    updated: 2026-10-01
    tags: [propina, propinas, tips, tip, gratuity]
    questions:
      es:
        - "¿Las propinas son para mí?"
        - "¿Me quedo las propinas?"
        - "¿Hay propinas?"
      en:
        - "Do I keep the tips?"
        - "Are tips for the driver?"
        - "Do customers tip?"
      ca:
        - "Les propines són per a mi?"
        - "Em quedo les propines?"
        - "Hi ha propines?"
    answer:
      es-ES: "Sí, las propinas son íntegras para quien reparte, tanto las de la app como las que te den en mano."
      en: "Yes, tips go entirely to the driver, both in-app tips and the ones given to you in person."
      ca-ES: "Sí, les propines són íntegrament per a qui reparteix, tant les de l'app com les que et donin en mà."

  # --- process -----------------------------------------------------------------------
  - id: training
    country: all
    updated: 2026-10-01
    tags: [formacion, curso, aprender, experiencia, training, course, learn, onboarding]
    questions:
      es:
        - "¿Hay formación?"
        - "¿Me enseñáis cómo funciona?"
        - "No tengo experiencia, ¿me formáis?"
      en:
        - "Is there training?"
        - "Will you teach me how it works?"
        - "I have no experience, do you train?"
      ca:
        - "Hi ha formació?"
        - "M'ensenyeu com funciona?"
        - "No tinc experiència, em formeu?"
    answer:
      es-ES: "Sí: el primer día tienes una formación pagada de unas 3 horas sobre la app, seguridad vial y atención al cliente, y tus primeros turnos los haces con un compañero."
      en: "Yes: on your first day there is a paid training of about 3 hours on the app, road safety and customer service, and your first shifts are with a colleague."
      ca-ES: "Sí: el primer dia tens una formació pagada d'unes 3 hores sobre l'app, seguretat viària i atenció al client, i els primers torns els fas amb un company."

