    updated: 2026-10-01
    tags: [contrato, alta, seguridad social, autonomo, laboral, contract, employee, freelance]
    questions:
      es:
        - "¿Qué tipo de contrato es?"
        - "¿Me dais de alta en la Seguridad Social?"
        - "¿Tengo que ser autónomo?"
        - "¿Es con contrato?"
      en:
        - "What kind of contract is it?"
        - "Do I have to be self-employed?"
        - "Is it a proper employment contract?"
      ca:
        - "Quin tipus de contracte és?"
        - "Em doneu d'alta a la Seguretat Social?"
        - "He de ser autònom?"
        - "És amb contracte?"
    answer:
      es-ES: "En España es un contrato laboral con alta en la Seguridad Social desde el primer día, no tienes que ser autónomo. Hay contratos de jornada completa y de media jornada."
      en: "In Spain it's an employment contract, registered with Social Security from day one; you don't need to be self-employed. There are full-time and part-time contracts."
      ca-ES: "A Espanya és un contracte laboral amb alta a la Seguretat Social des del primer dia, no cal que siguis autònom. Hi ha contractes de jornada completa i de mitja jornada."

