# Grupo Sazón: approved answers to candidates' frequent questions (spec 009).
#
# FICTIONAL DEMO DATA. Every figure, rule and process below is invented for the demo
# and is plausible, not real. Grupo Sazón replaces this file with its own approved
# answers before going live. Sofi only ever answers from this file: a question it does
# not cover gets "lo consulto con el equipo" and is flagged for a recruiter.
#
# What you can change:
#   - retrieval: how sure the search must be before Sofi answers.
#       min_score:    below this, the question counts as unanswered (raise it if Sofi
#                     answers the wrong question, lower it if she says "lo consulto"
#                     too often). Check the dashboard's unanswered list after a change.
#       top_k:        how many entries are considered for one question.
#       relative_min: an extra entry is shown to the AI only if it scores at least this
#                     share of the best one.
#       country_boost: preference for the entry of the candidate's country.
#   - max_answer_chars: an answer plus the next question must fit in one message.
#   - entries: one per topic.
#       id:        short, unique, never reused (analytics count by id).
#       country:   ES, MX or all. When the candidate's country is not known yet, only
#                  "all" entries are used, so a topic that differs by country also
#                  needs a general entry ("depends on the city").
#       updated:   when the client last approved the text.
#       tags:      extra search words, any language.
#       questions: 3-5 ways candidates ask it, in Spanish (es), English (en) and
#                  Catalan (ca).
#       answer:    the approved text per register: es-ES, en and ca-ES are required;
#                  es-MX is optional and replaces es-ES for Mexico.
#
# Rules (checked at startup): unique ids; every entry has es, en and ca questions and
# an es-ES, en and ca-ES answer; answers ask nothing (no question marks) and are not longer
# than max_answer_chars. Ranges, never promises: "entre X y Y", "depende de...".

version: "2026-10-19.1"

retrieval:
  top_k: 3
  min_score: 3.0
  relative_min: 0.85
  country_boost: 1.25
  k1: 1.2
  b: 0.5

max_answer_chars: 330

entries:
  # --- pay and contract: differ by country --------------------------------------------
  - id: pay-es
    country: ES
    updated: 2026-10-01
    tags: [pago, sueldo, salario, cobrar, dinero, euros, tarifa, pay, salary, wage, money, rate]
    questions:
      es:
        - "¿Cuánto se paga?"
        - "¿Cuánto se cobra por hora?"
        - "¿Cuál es el sueldo?"
        - "¿Cuánto pagan la hora?"
        - "¿Cuánto voy a ganar?"
      en:
        - "How much do you pay?"
        - "What is the hourly rate?"
        - "What's the salary?"
        - "How much will I earn?"
      ca:
        - "Quant es paga?"
        - "Quant pagueu l'hora?"
        - "Quin és el sou?"
        - "Quant guanyaré?"
    answer:
      es-ES: "En España se paga entre 9 y 12 € brutos la hora, según la ciudad y la franja, más un extra por pedido en noches y fines de semana. El importe exacto te lo confirma el equipo en la entrevista."
      en: "In Spain the pay is between 9 and 12 € gross per hour, depending on the city and the shift, plus an extra per order at nights and weekends. The team confirms the exact amount at the interview."
      ca-ES: "A Espanya es paga entre 9 i 12 € bruts l'hora, segons la ciutat i la franja, més un extra per comanda a les nits i els caps de setmana. L'import exacte te'l confirma l'equip a l'entrevista."

