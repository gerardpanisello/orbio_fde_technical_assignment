      en: "After these questions there is a short interview with the team. If it goes well, you sign the contract, do the training and start, usually within one or two weeks."
      ca-ES: "Després d'aquestes preguntes tens una entrevista curta amb l'equip. Si tot va bé, signes el contracte, fas la formació i comences, normalment en una o dues setmanes."

