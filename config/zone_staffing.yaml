# Grupo Sazón: initial staffing per served area (spec 015). SEED ONLY.
#
# Read once, the first time the API starts with an empty database. After that, the
# database is the source of truth: recruiters edit targets and current drivers in the
# dashboard "Zonas" page, and "Contratar" adds one driver to the candidate's area.
# Editing this file later changes nothing in an existing database.
#
# What you can change:
#   - target_drivers: how many drivers the area needs.
#   - current_drivers: how many it has today.
#   Occupancy = current / target. Below the bands in screening.yaml (scoring.zone_demand)
#   candidates in the area get extra priority; at or above 100 % they are waitlisted
#   instead of being offered an interview (never rejected).
#   - Leave an area out to mean "no data": no extra priority, never waitlisted.
#
# Rules (checked at startup): every id is a served area from service_areas.yaml (a zone,
# or a city served as a whole); numbers are whole and not negative.

version: "2026-10-12.1"

areas:
